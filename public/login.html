<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portal Login — UdaraAPI</title>
  <meta name="description" content="Masuk ke portal developer UdaraAPI untuk mengelola API Key dan memantau analitik telemetri ISPU." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --c-bg: #090d16;
      --c-card: #ffffff;
      --c-text-main: #0f172a;
      --c-text-muted: #64748b;
      --c-primary: #ea580c;
      --c-primary-hover: #c2410c;
      --c-primary-light: #fff7ed;
      --c-border: #e2e8f0;
      --r-pill: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      background-color: var(--c-bg);
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(234, 88, 12, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #090d16 0%, #0d1322 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-text-main);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .auth-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .brand-logo-badge {
      width: 52px;
      height: 52px;
      background: var(--c-primary-light);
      border: 1.5px solid #fed7aa;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(234, 88, 12, 0.2);
    }

    .brand-logo-badge img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--c-text-main);
      letter-spacing: -0.02em;
    }

    .brand-desc {
      font-size: 13px;
      color: var(--c-text-muted);
      line-height: 1.5;
    }

    /* Modern Pill Tabs */
    .auth-tabs-pill {
      display: flex;
      background: #f1f5f9;
      border: 1px solid var(--c-border);
      padding: 4px;
      border-radius: var(--r-pill);
      gap: 4px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 8px;
      border-radius: var(--r-pill);
      font-size: 13px;
      font-weight: 700;
      color: var(--c-text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .auth-tab-btn.active {
      background: #ffffff;
      color: var(--c-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--c-text-muted);
      letter-spacing: 0.02em;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3.5px var(--c-primary-light);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: var(--r-pill);
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
      transition: all 0.2s ease;
      margin-top: 6px;
      font-family: inherit;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #c2410c, #ea580c);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
    }

    .auth-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--c-text-muted);
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .auth-footer a {
      color: var(--c-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideToast 0.3s ease;
    }

    @keyframes slideToast {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    
    <div class="auth-header">
      <div class="brand-logo-badge">
        <img src="/assets/images/logo.png" alt="UdaraAPI Logo" />
      </div>
      <h1 class="brand-title">Developer Portal</h1>
      <p class="brand-desc">Akses data telemetri kualitas udara dan kelola kunci API Anda.</p>
    </div>

    <!-- Pill Tabs -->
    <div class="auth-tabs-pill">
      <button class="auth-tab-btn active" id="tabLogin" onclick="setAuthMode('login')">Masuk</button>
      <button class="auth-tab-btn" id="tabRegister" onclick="setAuthMode('register')">Daftar Akun</button>
    </div>

    <!-- Form -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      
      <div class="form-group" id="groupName" style="display:none">
        <label class="form-label" for="inputName">Nama Lengkap</label>
        <input type="text" id="inputName" class="form-input" placeholder="e.g. Hafiz Kurniawan" />
      </div>

      <div class="form-group">
        <label class="form-label" for="inputEmail">Email Developer</label>
        <input type="email" id="inputEmail" class="form-input" placeholder="developer@udara-api.id" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="inputPassword">Kata Sandi</label>
        <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter" required />
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Masuk ke Dashboard</span>
      </button>

    </form>

    <div class="auth-footer">
      <a href="/">← Kembali ke Beranda</a>
      <span>UdaraAPI v1.0</span>
    </div>

  </div>

  <div id="toastContainer"></div>

  <script>
    let currentMode = 'login';

    function setAuthMode(mode) {
      currentMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('groupName').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('btnSubmit').innerHTML = mode === 'login' ? '<span>Masuk ke Dashboard</span>' : '<span>Buat Akun Developer</span>';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value;
      const name = document.getElementById('inputName').value.trim();

      btn.disabled = true;
      btn.innerHTML = '<span>Memproses...</span>';

      const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';
      const payload = currentMode === 'login' ? { email, password } : { name, email, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.success && json.data) {
          localStorage.setItem('udaraapi_token', json.data.token);
          localStorage.setItem('udaraapi_user', JSON.stringify(json.data.user));
          showToast(currentMode === 'login' ? 'Login berhasil!' : 'Akun berhasil dibuat!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } else {
          showToast(json.error || 'Terjadi kesalahan saat autentikasi.', 'error');
          btn.disabled = false;
          btn.innerHTML = currentMode === 'login' ? '<span>Masuk ke Dashboard</span>' : '<span>Buat Akun Developer</span>';
        }
      } catch (err) {
        showToast('Koneksi gagal. Silakan coba beberapa saat lagi.', 'error');
        btn.disabled = false;
        btn.innerHTML = currentMode === 'login' ? '<span>Masuk ke Dashboard</span>' : '<span>Buat Akun Developer</span>';
      }
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + message;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }
  </script>
</body>
</html>
